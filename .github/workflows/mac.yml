name: macOS app

on:
  push:
    branches: [main, mac-version]
    tags: ["v*"]
    paths: ["mac/**", "SOUNDBOY/Assets/**", "SOUNDBOY/SOUNDBOY.csproj", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests (BPM/key, Rekordbox XML, EQ presets, playlists)
        working-directory: mac
        run: swift test

      - name: Build, sign and package
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash mac/scripts/build.sh

      - name: UI snapshots (demo data)
        run: |
          mkdir -p mac/build/snapshots
          SOUNDBOY_PROFILE=ci timeout 90 mac/build/SOUNDBOY.app/Contents/MacOS/SOUNDBOY --snapshot "$PWD/mac/build/snapshots" || true
          ls -la mac/build/snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: SOUNDBOY-mac
          path: |
            mac/build/*.dmg
            mac/build/snapshots/*.png
          if-no-files-found: warn

      - name: Attach DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" mac/build/*.dmg --clobber
